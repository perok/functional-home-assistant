// Applied with `sbt scalafixAll`; `sbt scalafixAll --check` fails instead of
// rewriting. Not a CI step: the warning gate (-Werror in CI, see build.sbt) is
// what enforces, and scalafix is the tool that makes obeying it cheap.
//
// RemoveUnused reads the compiler's own -Wunused findings out of semanticdb,
// so it deletes exactly what the gate would fail on.
//
// The Typelevel rules are the ones from `typelevel-scalafix` that hold on
// Scala 3. TypelevelUnusedIO is the one worth the setup: an `IO` built and
// then dropped in statement position compiles, runs nothing, and passes tests.
// DisableSyntax bans `asInstanceOf`. Where the result type is fixed by the
// value being matched, Scala 3's GADT refinement narrows the type parameter
// from the `case` pattern alone and no cast is needed; a `match` with a named
// failure is the answer almost everywhere else, and reports what it actually
// got instead of a ClassCastException.
//
// To permit one, put `// scalafix:ok DisableSyntax` on the SAME LINE as the
// expression. That is the MAINTAINER's call — ask before adding one.
rules = [
  DisableSyntax,
  RemoveUnused,
  TypelevelUnusedIO,
  TypelevelMapSequence,
  TypelevelAs,
  TypelevelUnusedShowInterpolator,
  TypelevelHttp4sLiteralsSyntax
]

DisableSyntax.noAsInstanceOf = true
