<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Unqualified on purpose: app.css is a single dark palette, not a themed
       page, so both schemes want this one colour. Without it the editor falls
       back to the manifest's theme_color, which tracks the DASHBOARD's theme
       and has nothing to do with what this page looks like.
       Reaches a browser tab only: inside the installed app Chrome ignores the
       document's meta and takes the manifest's anyway (see PwaAssets). That is
       survivable here and not worth a second manifest — the value it falls
       back to is the dashboard's, which is dark while ChromeColors.base is. -->
  <meta name="theme-color" content="#1e1e1e">
  <base href="__BASE__">
  <title>Dashboard editor</title>
  <script type="application/json" id="fh-editor-config">__CONFIG__</script>
  <link rel="stylesheet" href="edit/app.css">
</head>
<body>
  <div id="fh-editor">
    <aside id="fh-files">
      <div class="fh-hd">Dashboards</div>
      <ul id="fh-file-list"></ul>
      <button id="fh-dump-refresh" title="Re-fetch the entity dump from Home Assistant; swaps in only if every dashboard still builds (old dump kept as a dated backup)">↻ refresh dump</button>
    </aside>
    <main id="fh-main">
      <div id="fh-editor-host"></div>
      <div id="fh-status"><span id="fh-status-file"></span><span id="fh-status-msg"></span></div>
    </main>
    <section id="fh-preview">
      <div class="fh-hd">Preview: <select id="fh-preview-slug"></select></div>
      <iframe id="fh-preview-frame" title="dashboard preview"></iframe>
    </section>
  </div>
  <script type="module" src="__APP_JS__"></script>
</body>
</html>
