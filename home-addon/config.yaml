name: FH Dashboard
version: "0.1.42"
slug: fh_dashboard
description: Pkl-authored Datastar dashboards for Home Assistant
url: https://github.com/perok/functional-home-assistant
arch:
  - amd64
  - aarch64
image: ghcr.io/perok/fh-dashboard
# The image is built on ghcr.io/hassio-addons/base (s6-overlay), which brings
# its own init.
init: false
# Supervisor proxy to HA core (REST http://supervisor/core/api/ + WS
# ws://supervisor/core/websocket) with SUPERVISOR_TOKEN; hassio_api not needed.
homeassistant_api: true
ingress: true
ingress_port: 8080
# Never buffer — the dashboard is one long-lived SSE patch stream.
ingress_stream: true
panel_icon: mdi:view-dashboard
panel_title: FH Dashboard
ports:
  8080/tcp: null
ports_description:
  8080/tcp: >-
    Direct dashboard access, UNAUTHENTICATED — the server drives Home
    Assistant with its own token, so only enable this on a trusted LAN.
# Seed dashboards into the main HA config dir (/homeassistant) rather than the
# add-on's private config (/addon_configs/<slug>, mounted as addon_config):
# the File editor / Samba add-ons only expose the homeassistant/ share by
# default, so addon_config files aren't reachable for editing.
map:
  - homeassistant_config:rw
# Everything under /data that is a CACHE and can be refetched. Without this
# they ride in every Home Assistant backup: `pkl-cache` holds the packaged
# authoring library and the entity dump, `assets-cache` the downloaded theme
# CSS and fonts. Both are rebuilt on demand, so backing them up costs snapshot
# size and restores nothing that matters.
#
# A bare directory name is enough, and that is not obvious from the docs
# (which say only "list of files/paths (with glob support)"). The supervisor
# tests each pattern with `PurePath.match`, which matches from the RIGHT, and
# securetar applies the filter to a directory BEFORE descending into it — so
# one name prunes the whole subtree. Do not write `pkl-cache/**` instead:
# `match` does not treat `**` as recursive and that pattern matches nothing at
# all, silently.
#
# Relative-looking, but matched against the supervisor's own absolute path.
# The names are the leaf of FH_PKL_CACHE_DIR / FH_ASSETS_DIR in run.sh; if one
# moves, this moves. `graal-cache` is Truffle's own unpack of the GraalJS
# native library, re-extracted whenever a GraalVM bump changes its hash.
# A BARE name prunes the whole subtree (PurePath.match from the right, and
# securetar filters a directory before descending); `graal-cache/**` would
# silently match nothing, because `match` does not treat `**` as recursive.
backup_exclude:
  - pkl-cache
  - assets-cache
  - graal-cache
options:
  watch_registry: true
schema:
  # Rebuild the typed entity dump automatically when the HA registry changes
  # (device/entity/area/floor added, renamed or removed, integration loaded).
  # The swap is validated first: it never lands if it would break a dashboard
  # that builds today, and the previous dump is kept as a dated backup.
  watch_registry: bool?
  # JVM max heap, as a `-Xmx` value ("512M", "1G"). Deliberately absent from
  # `options:` above so the default lives in exactly one place — run.sh —
  # rather than being stated twice and drifting.
  max_heap: str?
  # JVM STARTING heap ("64M" by default). Exposed beside `max_heap` because
  # it is the end that actually decides the idle footprint, and because a
  # heap raised at one end and not the other is the mismatch that makes the
  # collector grow and shrink repeatedly on a slow box.
  min_heap: str?
  # Enable Native Memory Tracking, then read the breakdown with
  #   docker exec addon_<slug> jcmd 1 VM.native_memory summary
  # It costs a few percent and needs a restart to take effect, which is why
  # it is an option and not something the running server can switch on.
  memory_tracking: bool?
  # OTLP collector to send traces to, e.g. "http://192.168.1.50:4318". Empty
  # (the default) means the OpenTelemetry SDK is never started at all, not
  # merely that nothing is exported — which is the point on this hardware.
  # Everything else about the exporter is set through the standard OTEL_*
  # environment variables rather than an option each.
  otlp_endpoint: str?
