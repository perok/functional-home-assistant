# CI + CD in one pipeline.
#
# ci: every PR and main push — test + assemble the fat jar (scoped to
#     fh-datastar-view: home/home-codegen need live-HA codegen and cannot
#     compile in CI; tests run on fake dumps, no HA needed).
# cd: main only, after ci is green. Publishes ONLY when home-addon/config.yaml
#     names a version that is not fully on GHCR yet: builds the add-on container
#     (amd64 + aarch64) from the ci-built jar, pushes
#     ghcr.io/perok/fh-dashboard:{X.Y.Z, latest}, and creates the vX.Y.Z
#     GitHub release. So releasing = merging a version bump; an unchanged
#     version makes cd a no-op. (The supervisor reads config.yaml from main to
#     offer updates, so main's version and the published image can never
#     drift.)
#     The image push and the release are gated independently, so a
#     workflow_dispatch re-run after a sporadic partial failure finishes the
#     missing half: the push is skipped only when {version,latest} are both on
#     GHCR, and the release is created only when vX.Y.Z is not released yet.
name: CICD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/perok/fh-dashboard
  # Compiler warnings are errors here and advisory locally (#115) — sbt-tpolecat
  # reads this variable itself, and build.sbt's default is the other arm. Set it
  # locally the same way to reproduce a warning CI failed on.
  SBT_TPOLECAT_CI: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write # For mikepenz/action-junit-report
    steps:
      - uses: actions/checkout@v7

      # scala-cli runs the fh script's own test suite below.
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          apps: scalafmt scala-cli

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # node is a BUILD requirement for fh-datastar-view: `frontendBundle` is a
      # resource generator (project/NpmPlugin.scala), so sbt itself runs
      # `npm ci` + vite on compile and packages the result into the jar. Nothing
      # built is committed, so there is no separate bundling step here — just
      # make node available and let sbt drive it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/fh-datastar-view/package-lock.json

      # The pinned Datastar bundle the morph-contract suite runs against. It is
      # fetched from `Server.DatastarCdn` on a miss — the same constant
      # production serves — so this only ever saves a 34KB download, never
      # decides which version is tested.
      #
      # Keyed on build.sbt like the Playwright cache below: one key everyone
      # already knows to look at. The cache holds content-addressed files
      # (AssetCache.hashName), so a stale key costs at most one re-download and
      # never the wrong bundle — which is why the key does not need to track the
      # URL constant.
      - name: Cache web assets
        uses: actions/cache@v6
        with:
          path: ~/.cache/fh
          key: ${{ runner.os }}-fh-assets-${{ hashFiles('**/build.sbt') }}
          restore-keys: ${{ runner.os }}-fh-assets-

      # Cache Playwright browsers based on lockfile
      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/build.sbt') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: sbt 'fh-datastar-view/Test/runMain com.microsoft.playwright.CLI install --with-deps chromium'

      # The `pkl test` CLI, for the authoring-library suite below. Pinned to the
      # SAME version as the `org.pkl-lang:pkl-core` dep in build.sbt — the tests
      # exercise the library the server evaluates in-process, so a CLI on a
      # different version would be testing different semantics than we ship.
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: "0.32.1"

      - parallel:
          - name: Fmt check
            run: scalafmt --test

          # Unit tests for the `@fh-dashboard` authoring library (facts +
          # examples). Pure Pkl — no HA, no JVM, no dump. The report dir is
          # chosen to match the `Publish Test Report` glob below
          # (`**/target/**/test-reports/*.xml`), so pkl failures surface in the
          # same PR annotation as the Scala ones.
          - name: Test pkl library
            run: |
              pkl test \
                --junit-reports target/pkl/test-reports \
                modules/fh-datastar-view/src/test/pkl/*.test.pkl

          # ONE sbt invocation, and the parallel block must keep exactly one
          # (see the `--server=false` note on the fh script step). Two sbt
          # clients here talk to the same server in the same project dir and
          # serialize while both hold a runner slot; a SEQUENTIAL scalafix step
          # before the block is worse still, because it leaves the server warm
          # so the browser suites start immediately and race scala-cli's
          # compile — six runs of that produced four Playwright timeouts on
          # three different tests, none of them reproducible locally.
          #
          # Tests FIRST in the chain: sbt aborts the rest on failure, so this
          # order always leaves the junit XML that `Publish Test Report`
          # requires. `--check` rewrites nothing and fails on any diff it would
          # make (#115) — the linter half, which the -Werror gate cannot see.
          - name: Test + scalafix check
            env:
              # Out of the build tree, so the upload path does not depend on
              # sbt's working directory for a forked test.
              FH_VISUAL_FAILURES_DIR: ${{ runner.temp }}/visual-failures
            run: |
              sbt 'fh-datastar-view/testFull' \
                  'fh-datastar-view/scalafixAll --check'

          # The fh laptop script's own suite (in-process, gated on
          # SCALA_TEST_MODE; no instance needed) — also compile-checks the
          # script itself.
          - name: Test fh script
            working-directory: scripts
            # --server=false: no Bloop daemon — its 30s startup handshake
            # times out under CPU contention with the parallel sbt step.
            run: scala-cli test . --server=false

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/target/**/test-reports/*.xml'
          require_tests: true

      # A visual snapshot mismatch (ComponentVisualSuite) is a local vs
      # ubuntu-latest font-rasterization diff that can only be judged by eye,
      # so ship the before/after PNG pair VisualSnapshot drops on failure as a
      # downloadable archive. `if-no-files-found: ignore` keeps a non-visual
      # failure (fmt, a behavioural suite) from erroring here.
      - name: Upload visual snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshot-failures
          path: ${{ runner.temp }}/visual-failures/
          if-no-files-found: ignore
          retention-days: 1

      - name: Assemble fat jar
        run: sbt 'fh-datastar-view/assembly'

      - name: Upload jar for cd
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: addon-jar
          path: target/addon/fh-dashboard.jar
          retention-days: 1

  cd:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: 
      contents: write # cd creates the release tag
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read version, check GHCR + release state
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' home-addon/config.yaml)"
          if [ -z "$VERSION" ]; then
            echo "could not read version from home-addon/config.yaml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Skip the push only when BOTH the versioned image and `latest` are
          # already on GHCR; if either is missing (sporadic partial publish)
          # re-running re-pushes and finishes the job.
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1 && \
             docker manifest inspect "$IMAGE:latest" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION and :latest already on GHCR — skipping push"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already released — skipping release"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch ci-built jar
        if: steps.ver.outputs.published == 'false'
        uses: actions/download-artifact@v8
        with:
          name: addon-jar
          path: target/addon/

      # QEMU: the Dockerfile's jlink stage must execute under linux/arm64
      # during the multi-arch build.
      - uses: docker/setup-qemu-action@v4
        if: steps.ver.outputs.published == 'false'
      - uses: docker/setup-buildx-action@v4
        if: steps.ver.outputs.published == 'false'

      - uses: docker/login-action@v4
        if: steps.ver.outputs.published == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.ver.outputs.published == 'false'
        with:
          context: .
          file: home-addon/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            io.hass.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.source=https://github.com/perok/functional-home-assistant

      - name: Tag + GitHub release
        if: steps.ver.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --target "$GITHUB_SHA" --generate-notes \
            --title "v${{ steps.ver.outputs.version }}"
